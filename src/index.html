<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla App Template</title>
  <link rel="stylesheet" href="css/index.css" />
  <script type="module" src="js/index.js"></script>
</head>
<body data-color-scheme="light">
<header class="page-header">
  <div class="container page-header-container">
    <nav class="page-nav">
      <a class="page-logo" href="index.html">
        <svg class="page-logo-icon" width="32" height="32">
          <use href="./img/icons.svg"></use>
        </svg>
        <span class="page-logo-text">
            Image <br />
            Gallery
          </span>
      </a>
    </nav>
    <div class="theme-toggle">
      <input class="toggle-checkbox js-toggle-checkbox visually-hidden" id="toggle-checkbox" type="checkbox" />
      <label class="toggle-container" for="toggle-checkbox">
        <span class="toggle-icon"></span>
      </label>
    </div>
  </div>
</header>
<main>
  <section class="gallery-section">
    <div class="container">
      <h2 class="visually-hidden">Gallery</h2>
      <ul class="gallery-list js-gallery-list">
      </ul>
    </div>
  </section>
</main>
</body>
</html>
